<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XMONE Platform</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0D0D0D; color: #FFFFFF; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    
    :root { --primary-yellow: #FFC107; --dark-bg: #121212; --card-bg: #1E1E1E; }

    header { width: 100%; max-width: 480px; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #171717; border-bottom: 1px solid #2A2A2A; }
    .logo-container { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 1.3rem; color: var(--primary-yellow); }
    .user-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--primary-yellow); color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; }
    .user-id { font-size: 0.85rem; color: #AAA; direction: ltr; }

    .container { width: 100%; max-width: 480px; padding: 20px; flex: 1; }

    .balance-card { background: linear-gradient(135deg, #1E1E1E, #252525); border: 1px solid #333; border-radius: 16px; padding: 25px; text-align: center; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .balance-title { color: #888; font-size: 0.9rem; margin-bottom: 8px; }
    .balance-amount { font-size: 2.4rem; font-weight: bold; color: var(--primary-yellow); margin-bottom: 20px; }
    
    .action-btn { width: 100%; padding: 15px; background: var(--primary-yellow); color: #000; font-weight: bold; font-size: 1.1rem; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; }
    .action-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); justify-content: center; align-items: flex-end; z-index: 1000; }
    .modal-content { width: 100%; max-width: 480px; background: #1E1E1E; border-radius: 20px 20px 0 0; padding: 25px; border-top: 2px solid var(--primary-yellow); }
    .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #2A2A2A; }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
    .verified { background: #1B5E20; color: #81C784; }
    .unverified { background: #4A0000; color: #E57373; }
    
    .auth-box { background: #1E1E1E; padding: 25px; border-radius: 16px; border: 1px solid #333; text-align: center; margin-top: 40px; }
    .auth-box input { width: 100%; padding: 12px; margin: 10px 0; background: #121212; border: 1px solid #333; color: #fff; border-radius: 8px; text-align: center; }
  </style>
</head>
<body>

  <header id="appHeader" style="display:none;">
    <div class="logo-container">
      <span>⚡ $XMONE</span>
    </div>
    <div class="user-info" onclick="toggleModal(true)">
      <div class="user-id" id="displayUserId">XM-000000</div>
      <div class="avatar">👤</div>
    </div>
  </header>

  <div class="container">
    <div id="authScreen" class="auth-box">
      <h2 style="color: var(--primary-yellow); margin-bottom: 20px;">تسجيل الدخول إلى $XMONE</h2>
      <input type="email" id="email" placeholder="البريد الإلكتروني">
      <input type="password" id="password" placeholder="كلمة المرور">
      <button class="action-btn" id="loginBtn" onclick="loginEmail()">دخول / إنشاء حساب</button>
      <div id="statusMsg" style="margin-top: 15px; font-size: 0.85rem; color: #FFC107;"></div>
    </div>

    <div id="mainScreen" style="display:none;">
      <div class="balance-card">
        <div class="balance-title">إجمالي الرصيد (USD)</div>
        <div class="balance-amount" id="balanceDisplay">$0.00</div>
        <button id="mineBtn" class="action-btn" onclick="startMining()">تشغيل (+3.12%)</button>
        <p id="timerText" style="color: #AAA; margin-top: 10px; font-size: 0.85rem;"></p>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal" onclick="if(event.target === this) toggleModal(false)">
    <div class="modal-content">
      <h3 style="margin-bottom: 15px; color: var(--primary-yellow);">إعدادات الحساب</h3>
      <div class="setting-item">
        <span>توثيق الحساب</span>
        <span id="verifyBadge" class="badge unverified">غير موثق</span>
      </div>
      <div class="setting-item" onclick="alert('تواصل مع خدمة العملاء')" style="cursor:pointer;">
        <span>خدمة العملاء</span>
        <span>🎧</span>
      </div>
      <div class="setting-item" onclick="logout()" style="cursor:pointer; color: #FF5252;">
        <span>تسجيل الخروج</span>
        <span>🚪</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://gtzmjyoulhwigenakdsz.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0em1qeW91bGh3aWdlbmFrZHN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNjAxNjQsImV4cCI6MjEwNzgzNjE2NH0.3Nd5Ip-liuThLl9sZzilL54Mz-fUDKH80CWkTeQK8rE';
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;
    let userProfile = null;

    async function init() {
      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (user) {
          currentUser = user;
          await loadProfile();
        }
      } catch (err) {
        console.error(err);
      }
    }
    init();

    // ربط الدوال بنافذة المتصفح لتعمل الأزرار
    window.loginEmail = async function() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const status = document.getElementById('statusMsg');
      const btn = document.getElementById('loginBtn');
      
      if (!email || !password) {
        alert('يرجى كتابة البريد وكلمة المرور');
        return;
      }

      status.innerText = 'جاري الاتصال...';
      btn.disabled = true;

      try {
        let { data, error } = await supabase.auth.signInWithPassword({ email, password });
        
        if (error) {
          status.innerText = 'جاري إنشاء حساب جديد...';
          let signUpRes = await supabase.auth.signUp({ email, password });
          
          if (signUpRes.error) {
            alert('خطأ أثناء التسجيل: ' + signUpRes.error.message);
            status.innerText = signUpRes.error.message;
            btn.disabled = false;
            return;
          }
          data = signUpRes.data;
        }
        
        if (data && data.user) {
          currentUser = data.user;
          status.innerText = 'تم الدخول بنجاح!';
          await loadProfile();
        } else {
          alert('يرجى مراجعة بريدك الإلكتروني');
          status.innerText = 'يرجى مراجعة البريد';
        }
      } catch (err) {
        alert('خطأ عام: ' + err.message);
        status.innerText = err.message;
      } finally {
        btn.disabled = false;
      }
    };

    async function loadProfile() {
      try {
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('appHeader').style.display = 'flex';
        document.getElementById('mainScreen').style.display = 'block';

        const { data, error } = await supabase
          .from('profiles')
          .select('*')
          .eq('id', currentUser.id)
          .single();

        if (error) {
          alert('خطأ في جلب بيانات الحساب: ' + error.message);
          return;
        }

        if (data) {
          userProfile = data;
          document.getElementById('displayUserId').innerText = data.user_id_code;
          document.getElementById('balanceDisplay').innerText = `$${parseFloat(data.balance).toFixed(2)}`;
          
          const badge = document.getElementById('verifyBadge');
          if (data.is_verified) {
            badge.innerText = 'موثق ✓';
            badge.className = 'badge verified';
          } else {
            badge.innerText = 'غير موثق';
            badge.className = 'badge unverified';
          }

          checkMiningTimer();
        }
      } catch (err) {
        console.error(err);
      }
    }

    window.startMining = async function() {
      if (!userProfile) return;

      const now = new Date();
      let currentBal = parseFloat(userProfile.balance);
      let newBalance = currentBal === 0 ? 3.12 : currentBal * 1.0312;

      const { error } = await supabase
        .from('profiles')
        .update({ 
          balance: newBalance,
          last_mined_at: now.toISOString()
        })
        .eq('id', currentUser.id);

      if (error) {
        alert('حدث خطأ أثناء التحديث');
        return;
      }

      userProfile.balance = newBalance;
      userProfile.last_mined_at = now;
      document.getElementById('balanceDisplay').innerText = `$${newBalance.toFixed(2)}`;
      checkMiningTimer();
    };

    function checkMiningTimer() {
      const btn = document.getElementById('mineBtn');
      const timerText = document.getElementById('timerText');

      if (!userProfile.last_mined_at) {
        btn.disabled = false;
        timerText.innerText = '';
        return;
      }

      const lastMined = new Date(userProfile.last_mined_at);
      const now = new Date();
      const diffHours = (now - lastMined) / (1000 * 60 * 60);

      if (diffHours < 24) {
        btn.disabled = true;
        const remainingHours = Math.ceil(24 - diffHours);
        timerText.innerText = `متاح التشغيل القادم بعد ${remainingHours} ساعة`;
      } else {
        btn.disabled = false;
        timerText.innerText = 'التشغيل متاح الآن!';
      }
    }

    window.toggleModal = function(show) {
      document.getElementById('settingsModal').style.display = show ? 'flex' : 'none';
    };

    window.logout = async function() {
      await supabase.auth.signOut();
      location.reload();
    };
  </script>
</body>
</html>
